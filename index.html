<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B10">
  <title>Track Circle — Stay Connected. Stay Close.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080B10;
      color: #F7FAF9;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border: 1px solid #19E6A0;
      border-radius: 24px; color: #19E6A0;
      font-size: 36px; box-shadow: 0 0 35px #19e6a022;
    }
    h1 { font-size: 27px; letter-spacing: 2px; margin: 0; }
    .tagline { color: #89939F; margin: 12px 0 32px; }
    .feature {
      background: #10151D; border: 1px solid #222B35;
      padding: 16px; margin: 10px 0; border-radius: 16px;
      text-align: left;
    }
    .feature strong { display: block; margin-bottom: 5px; }
    .feature span { color: #89939F; font-size: 13px; }
    button {
      width: 100%; padding: 16px; margin-top: 12px;
      border: 0; border-radius: 14px; font-size: 15px;
      font-weight: bold; cursor: pointer;
    }
    .primary { background: #19E6A0; color: #080B10; }
    .secondary { background: #10151D; color: #F7FAF9; border: 1px solid #303945; }
    #status { color: #19E6A0; font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">⌖</div>
    <h1>TRACK CIRCLE</h1>
    <p class="tagline">Stay Connected. Stay Close.</p>

    <div class="feature">
      <strong>◉ Real-Time Location</strong>
      <span>Stay connected with the people who matter.</span>
    </div>
    <div class="feature">
      <strong>◎ Circles & Messaging</strong>
      <span>Bring your friends and groups together.</span>
    </div>
    <div class="feature">
      <strong>✦ Track AI</strong>
      <span>Your intelligent companion, right where you need it.</span>
    </div>

    <button class="primary" onclick="showStatus('Sign-in screen is our next build step.')">Sign In</button>
    <button class="secondary" onclick="showStatus('Account creation is our next build step.')">Create Account</button>
    <p id="status">Your journey starts here.</p>
  </main>
  <script>
    function showStatus(message) {
      document.getElementById('status').textContent = message;
    }
  </script>
</body>
</html>
