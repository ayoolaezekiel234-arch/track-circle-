<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Circle - Login</title>
    <!-- Include Supabase JS Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Reset and Layout */
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #080a10; /* Dark background */
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Top Subtitle */
        #top-subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }

        /* The Card Container */
        .card {
            background: #111827; /* Slightly lighter dark card */
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #1f2937;
        }

        /* Header */
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #38bdf8; /* Blue header */
            font-size: 24px;
            font-weight: 600;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #6366f1; /* Purple focus */
        }

        /* Social Buttons Placeholder (Design only, functional later) */
        .social-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .social-btn {
            background: #fff;
            color: #111827;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
        }
        .social-btn img { height: 16px; width: 16px; }

        /* Separator line */
        .separator {
            display: flex;
            align-items: center;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .separator::before, .separator::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #374151;
        }
        .separator::before { margin-right: 10px; }
        .separator::after { margin-left: 10px; }

        /* Main Action Button (Purple) */
        button#action-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #6366f1; /* Purple button */
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button#action-btn:hover { background: #4f46e5; }

        /* Bottom Switch */
        .switch {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .switch span {
            color: #6366f1; /* Purple link */
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        /* Message area */
        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 1em; /* Prevents jumping when message appears */
        }
    </style>
</head>
<body>

    <div id="top-subtitle">Sign into your account by entering your information below.</div>

    <div class="card">
        <h2 id="form-title">Welcome to Track Circle</h2>

        <!-- Social Sign-in Placeholders (Buttons) -->
        <div class="social-group">
            <button class="social-btn"><img src="https://authjs.dev/img/providers/google.svg"> Sign in with Google</button>
            <button class="social-btn"><img src="https://authjs.dev/img/providers/apple.svg"> Sign in with Apple</button>
            <button class="social-btn"><img src="https://authjs.dev/img/providers/github.svg"> Sign in with GitHub</button>
        </div>
        <div class="social-group">
            <button class="social-btn"><img src="https://authjs.dev/img/providers/microsoft.svg"> Sign in with Microsoft</button>
        </div>

        <div class="separator">Or continue with email</div>

        <!-- Email/Password Inputs -->
        <input type="email" id="email" placeholder="Email Address" />
        <input type="password" id="password" placeholder="Password" />
        
        <!-- Main Action Button -->
        <button id="action-btn" onclick="handleAuth()">Sign Up</button>

        <div id="message"></div>
    </div>

    <!-- Bottom Sign Up/In link -->
    <div class="switch" id="bottom-switch">Don't have an account? <span onclick="toggleMode()">Create Account</span></div>

    <script>
        // 1. Initialize Supabase with your project credentials
        const SUPABASE_URL = 'https://kthhdwaqqhqioxvfhjlx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aGhkd2FxcWhxaW94dmZoamx4Iiwicm9sZSI6ImFub24iLCJpYXQiOiJzOTE5MjIwMzQsImV4cCI6MjEwNzQ5ODAzNH0.lJyrG_lKfBW0G3o2cgkm_AiBqw19e9Go8c3TW-BPm20';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = false; // We start on Sign Up

        function toggleMode() {
            isLoginMode = !isLoginMode;
            
            // Update Titles
            document.getElementById('form-title').innerText = isLoginMode ? 'Welcome Back' : 'Welcome to Track Circle';
            document.getElementById('action-btn').innerText = isLoginMode ? 'Login' : 'Sign Up';
            
            // Update Bottom Link text
            document.getElementById('bottom-switch').innerHTML = isLoginMode ? 
                'Don\'t have an account? <span onclick="toggleMode()">Create Account</span>' : 
                'Already have an account? <span onclick="toggleMode()">Login</span>';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgEl = document.getElementById('message');

            if (!email || !password) {
                msgEl.style.color = '#f87171';
                msgEl.innerText = 'Please fill in all fields!';
                return;
            }

            msgEl.style.color = '#38bdf8';
            msgEl.innerText = 'Processing...';
            document.getElementById('action-btn').disabled = true; // Prevent double clicking

            if (isLoginMode) {
                // Log In Logic
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    msgEl.style.color = '#f87171';
                    msgEl.innerText = error.message;
                    document.getElementById('action-btn').disabled = false;
                } else {
                    msgEl.style.color = '#4ade80';
                    msgEl.innerText = 'Login successful! Redirecting to app...';
                    // Redirect user to main app page: window.location.href = "dashboard.html";
                }
            } else {
                // Sign Up Logic
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    msgEl.style.color = '#f87171';
                    msgEl.innerText = error.message;
                    document.getElementById('action-btn').disabled = false;
                } else {
                    msgEl.style.color = '#4ade80';
                    msgEl.innerText = 'Signup successful! Check your email for confirmation.';
                    document.getElementById('action-btn').disabled = false;
                }
            }
        }
    </script>
</body>
</html>
