<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Circle</title>
    <!-- Include Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #080a10;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN STYLES --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Shining dynamic sky and glowing trees atmosphere */
            background: linear-gradient(135deg, #050b14 0%, #0f172a 50%, #1e1b4b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .sky-glow {
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(99,102,241,0) 70%);
            border-radius: 50%;
            animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }
        .splash-content {
            position: relative;
            text-align: center;
            z-index: 2;
        }
        .splash-logo {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 8px;
            animation: fadeInScale 1.2s ease-out;
        }
        .splash-sub {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        @keyframes fadeInScale {
            0% { transform: translateY(15px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* --- MAIN APP AUTH SCREEN --- */
        #auth-container {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #111827;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #1f2937;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 22px;
        }

        /* Social Auth Buttons */
        .social-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .social-btn:hover { background: #374151; }
        .social-btn img { width: 18px; height: 18px; }

        .separator {
            display: flex;
            align-items: center;
            color: #6b7280;
            font-size: 13px;
            margin: 20px 0;
        }
        .separator::before, .separator::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #374151;
        }
        .separator::before { margin-right: 10px; }
        .separator::after { margin-left: 10px; }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: #080a10;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #6366f1; }

        button#action-btn {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button#action-btn:hover { background: #4f46e5; }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        .switch span {
            color: #38bdf8;
            cursor: pointer;
            font-weight: 500;
            text-decoration: underline;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN (Shining Sky & Trees Vibe) -->
    <div id="splash-screen">
        <div class="sky-glow"></div>
        <div class="splash-content">
            <div class="splash-logo">Track Circle</div>
            <div class="splash-sub">Connect • Share • Explore</div>
        </div>
    </div>

    <!-- 2. MAIN APP AUTHENTICATION SCREEN -->
    <div id="auth-container">
        <div class="card">
            <h2 id="form-title">Welcome to Track Circle</h2>

            <!-- Real OAuth Social Logins (Connected to Supabase Provider Handlers) -->
            <button class="social-btn" onclick="socialLogin('google')">
                <img src="https://authjs.dev/img/providers/google.svg" alt="Google"> Continue with Google
            </button>
            <button class="social-btn" onclick="socialLogin('apple')">
                <img src="https://authjs.dev/img/providers/apple.svg" alt="Apple"> Continue with Apple
            </button>

            <div class="separator">or use email</div>

            <!-- Email & Password Inputs -->
            <input type="email" id="email" placeholder="Email Address" />
            <input type="password" id="password" placeholder="Password" />
            
            <button id="action-btn" onclick="handleAuth()">Sign Up</button>

            <div class="switch" id="bottom-switch">
                Already have an account? <span onclick="toggleMode()">Log In</span>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <script>
        // --- 2-SECOND SPLASH SCREEN TIMER ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const auth = document.getElementById('auth-container');
                
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                
                auth.style.opacity = '1';
                auth.style.visibility = 'visible';
            }, 2000); // 2000 milliseconds = exactly 2 seconds
        });

        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://kthhdwaqqhqioxvfhjlx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aGhkd2FxcWhxaW94dmZoamx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjIwMzQsImV4cCI6MjEwNzQ5ODAzNH0.lJyrG_lKfBW0G3o2cgkm_AiBqw19e9Go8c3TW-BPm20';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = false;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? 'Welcome Back' : 'Welcome to Track Circle';
            document.getElementById('action-btn').innerText = isLoginMode ? 'Log In' : 'Sign Up';
            document.getElementById('bottom-switch').innerHTML = isLoginMode ? 
                'Don\'t have an account? <span onclick="toggleMode()">Sign Up</span>' : 
                'Already have an account? <span onclick="toggleMode()">Log In</span>';
            document.getElementById('message').innerText = '';
        }

        // --- EMAIL / PASSWORD AUTH HANDLER ---
        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('message');

            if (!email || !password) {
                msgEl.style.color = '#f87171';
                msgEl.innerText = 'Please fill in both email and password!';
                return;
            }

            msgEl.style.color = '#38bdf8';
            msgEl.innerText = 'Processing...';

            if (isLoginMode) {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    msgEl.style.color = '#f87171';
                    msgEl.innerText = error.message;
                } else {
                    msgEl.style.color = '#4ade80';
                    msgEl.innerText = 'Login successful! Welcome to Track Circle.';
                }
            } else {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    msgEl.style.color = '#f87171';
                    msgEl.innerText = error.message;
                } else {
                    msgEl.style.color = '#4ade80';
                    msgEl.innerText = 'Signup successful! Check your email to confirm.';
                }
            }
        }

        // --- SOCIAL OAUTH HANDLER (Google & Apple) ---
        async function socialLogin(providerName) {
            const msgEl = document.getElementById('message');
            msgEl.style.color = '#38bdf8';
            msgEl.innerText = `Connecting to ${providerName}...`;

            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: providerName,
                options: {
                    redirectTo: window.location.origin
                }
            });

            if (error) {
                msgEl.style.color = '#f87171';
                msgEl.innerText = error.message;
            }
        }
    </script>
</body>
</html>
