<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Circle - Stay Connected. Stay Close.</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #080B10;
            --bg-card: #10151D;
            --accent-mint: #19E6A0;
            --text-main: #F7FAF9;
            --text-secondary: #89939F;
            --border-color: #1F293D;
            --danger: #FF5C5C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* --- CINEMATIC SPLASH & ONBOARDING --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #05080c 0%, var(--bg-main) 50%, #111e18 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash-glow {
            position: absolute; width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(25,230,160,0.15) 0%, rgba(8,11,16,0) 70%);
            border-radius: 50%; animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 1; } }
        .splash-content { position: relative; text-align: center; z-index: 2; padding: 0 20px; }
        .splash-logo {
            font-size: 42px; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(90deg, #F7FAF9, var(--accent-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
        }
        .splash-tagline { font-size: 14px; color: var(--text-secondary); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 30px; }

        /* --- AUTH SCREEN --- */
        #auth-container {
            display: none; width: 100%; height: 100vh;
            justify-content: center; align-items: center; padding: 20px; background: var(--bg-main);
        }
        .card {
            background: var(--bg-card); padding: 35px 25px; border-radius: 20px;
            width: 100%; max-width: 420px; border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        h2 { text-align: center; margin-bottom: 8px; color: var(--text-main); font-size: 24px; font-weight: 800; }
        .card-sub { text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 25px; }
        
        input {
            width: 100%; padding: 14px 16px; margin-bottom: 16px;
            background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px;
            color: var(--text-main); font-size: 15px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--accent-mint); }
        
        button.primary-btn {
            width: 100%; padding: 14px; background: var(--accent-mint); border: none; border-radius: 12px;
            color: var(--bg-main); font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 5px;
            transition: opacity 0.2s; box-shadow: 0 4px 15px rgba(25,230,160,0.3);
        }
        button.primary-btn:hover { opacity: 0.9; }
        .switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary); }
        .switch span { color: var(--accent-mint); cursor: pointer; text-decoration: underline; font-weight: 600; }
        #message { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }

        /* --- MAIN DASHBOARD APP --- */
        #app-dashboard {
            display: none; width: 100%; height: 100vh;
            flex-direction: column; background: var(--bg-main); position: relative;
        }
        .app-header {
            padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-brand h1 { font-size: 18px; font-weight: 800; color: var(--accent-mint); letter-spacing: 0.5px; }
        .user-greeting { font-size: 12px; color: var(--text-secondary); }

        /* --- CONTENT SECTIONS --- */
        .app-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; width: 100%; max-width: 600px; margin: 0 auto; padding-bottom: 90px; }
        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; color: var(--text-main); }
        
        /* Map / GPS Card */
        .gps-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .gps-status { color: var(--accent-mint); font-weight: 600; margin: 10px 0; font-size: 14px; }
        
        /* Chat Feed */
        .chat-box { width: 100%; flex: 1; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; min-height: 350px; }
        .messages-list { flex: 1; padding: 15px; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 12px; }
        .message-item { background: #182232; padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; border: 1px solid var(--border-color); }
        .message-item span { display: block; font-size: 11px; color: var(--accent-mint); margin-bottom: 4px; font-weight: 700; }
        .chat-input-area { display: flex; padding: 12px; background: var(--bg-main); border-top: 1px solid var(--border-color); gap: 10px; }
        .chat-input-area input { margin: 0; flex: 1; }
        .chat-input-area button { width: 90px; margin: 0; background: var(--accent-mint); border: none; border-radius: 10px; color: var(--bg-main); font-weight: 800; cursor: pointer; }

        /* Profile & Settings Card */
        .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; text-align: center; }
        .avatar-circle { width: 80px; height: 80px; background: #1c293d; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--accent-mint); font-weight: 800; border: 2px solid var(--accent-mint); }

        /* --- BOTTOM NAVIGATION BAR --- */
        .nav-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75px;
            background: var(--bg-card); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { background: none; border: none; color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; }
        .nav-item.active { color: var(--accent-mint); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-map-btn {
            background: var(--accent-mint); width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--bg-main);
            box-shadow: 0 4px 15px rgba(25,230,160,0.4); margin-top: -15px; cursor: pointer; border: none;
        }
    </style>
</head>
<body>

    <!-- 1. CINEMATIC SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-glow"></div>
        <div class="splash-content">
            <div class="splash-logo">TRACK CIRCLE</div>
            <div class="splash-tagline">Stay Connected. Stay Close.</div>
        </div>
    </div>

    <!-- 2. AUTHENTICATION & ONBOARDING SCREEN -->
    <div id="auth-container">
        <div class="card">
            <h2 id="form-title">Welcome Back</h2>
            <div class="card-sub">Secure real-time location & social network</div>

            <input type="email" id="email" placeholder="Email Address" />
            <input type="password" id="password" placeholder="Password" />
            
            <button class="primary-btn" id="action-btn" onclick="handleAuth()">Sign In</button>

            <div class="switch" id="bottom-switch">
                Don't have an account? <span onclick="toggleMode()">Create Account</span>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <!-- 3. MAIN APPLICATION DASHBOARD -->
    <div id="app-dashboard">
        <div class="app-header">
            <div class="header-brand">
                <h1>TRACK CIRCLE</h1>
            </div>
            <div>
                <span class="user-greeting" id="user-email-display">Connected</span>
            </div>
        </div>

        <!-- MAIN VIEW CONTAINER -->
        <div class="app-content" id="main-view-area">
            <!-- Default Home / Track View -->
            <div class="section-title">Live Circle Radar</div>
            <div class="gps-card">
                <p style="color: var(--text-secondary); font-size: 13px;">GPS Location Sharing Status</p>
                <div class="gps-status" id="location-status">Acquiring satellite lock & GPS coordinates...</div>
                <button class="primary-btn" style="max-width: 200px; margin: 10px auto 0;" onclick="shareLocation()">Update GPS Position</button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR (6 Destinations) -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('track', this)">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                Track
            </button>
            <button class="nav-item" onclick="switchTab('circles', this)">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Circles
            </button>
            <button class="nav-map-btn" onclick="switchTab('map', this)" title="Live Map">
                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px; fill: #080B10;"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.1V5l6 2.1V19z"/></svg>
            </button>
            <button class="nav-item" onclick="switchTab('messages', this)">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                Messages
            </button>
            <button class="nav-item" onclick="switchTab('profile', this)">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                Profile
            </button>
            <button class="nav-item" onclick="switchTab('more', this)">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                More
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kthhdwaqqhqioxvfhjlx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aGhkd2FxcWhxaW94dmZoamx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjIwMzQsImV4cCI6MjEwNzQ5ODAzNH0.lJyrG_lKfBW0G3o2cgkm_AiBqw19e9Go8c3TW-BPm20';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- SPLASH & SESSION RESTORATION ---
        window.addEventListener('load', async () => {
            setTimeout(async () => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';

                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    enterApp(session.user);
                } else {
                    document.getElementById('auth-container').style.display = 'flex';
                }
            }, 2000);
        });

        let isLoginMode = true;
        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? 'Welcome Back' : 'Create Account';
            document.getElementById('action-btn').innerText = isLoginMode ? 'Sign In' : 'Sign Up';
            document.getElementById('bottom-switch').innerHTML = isLoginMode ? 
                'Don\'t have an account? <span onclick="toggleMode()">Create Account</span>' : 
                'Already have an account? <span onclick="toggleMode()">Sign In</span>';
            document.getElementById('message').innerText = '';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('message');

            if (!email || !password) {
                msgEl.style.color = 'var(--danger)';
                msgEl.innerText = 'Please enter both email and password.';
                return;
            }

            msgEl.style.color = 'var(--accent-mint)';
            msgEl.innerText = 'Authenticating securely...';

            if (isLoginMode) {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    msgEl.style.color = 'var(--danger)';
                    msgEl.innerText = error.message;
                } else {
                    enterApp(data.user);
                }
            } else {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    msgEl.style.color = 'var(--danger)';
                    msgEl.innerText = error.message;
                } else {
                    msgEl.style.color = 'var(--accent-mint)';
                    msgEl.innerText = 'Registration successful! Entering Track Circle...';
                    if (data.user) enterApp(data.user);
                }
            }
        }

        function enterApp(user) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-dashboard').style.display = 'flex';
            document.getElementById('user-email-display').innerText = user.email;
            shareLocation();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // --- REAL GPS & LOCATION SYNC ---
        function shareLocation() {
            const statusEl = document.getElementById('location-status');
            if (!navigator.geolocation) {
                statusEl.innerText = 'Geolocation is not supported by your browser.';
                return;
            }
            statusEl.innerText = 'Obtaining precise GPS fix...';
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;

                const { error } = await supabaseClient
                    .from('user_locations')
                    .upsert({ user_id: user.id, latitude: lat, longitude: lon, updated_at: new Date() }, { onConflict: 'user_id' });

                if (!error) {
                    statusEl.style.color = 'var(--accent-mint)';
                    statusEl.innerText = `Active & Broadcasting • Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                } else {
                    statusEl.style.color = 'var(--text-secondary)';
                    statusEl.innerText = `GPS Fixed • Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                }
            }, () => {
                statusEl.style.color = 'var(--danger)';
                statusEl.innerText = 'Location permission denied. Enable GPS in browser settings.';
            }, { enableHighAccuracy: true });
        }

        // --- NAVIGATION & VIEWS ---
        function switchTab(tab, el) {
            document.querySelectorAll('.nav-item, .nav-map-btn').forEach(item => item.classList.remove('active'));
            if (el) el.classList.add('active');
            const viewEl = document.getElementById('main-view-area');

            if (tab === 'track') {
                viewEl.innerHTML = `
                    <div class="section-title">Live Circle Radar</div>
                    <div class="gps-card">
                        <p style="color: var(--text-secondary); font-size: 13px;">GPS Location Sharing Status</p>
                        <div class="gps-status" id="location-status">Broadcasting live coordinates...</div>
                        <button class="primary-btn" style="max-width: 200px; margin: 10px auto 0;" onclick="shareLocation()">Update GPS Position</button>
                    </div>
                `;
                shareLocation();
            } else if (tab === 'circles') {
                viewEl.innerHTML = `
                    <div class="section-title">Your Circles</div>
                    <div class="gps-card" style="text-align: left;">
                        <h3 style="color: var(--accent-mint); margin-bottom: 8px;">Family & Close Friends</h3>
                        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 15px;">3 active members sharing location.</p>
                        <button class="primary-btn" style="font-size: 14px; padding: 10px;">+ Create New Circle</button>
                    </div>
                `;
            } else if (tab === 'map') {
                viewEl.innerHTML = `
                    <div class="section-title">Live Interactive Map</div>
                    <div class="gps-card" style="height: 350px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0d131c;">
                        <svg viewBox="0 0 24 24" style="width: 48px; height: 48px; fill: var(--accent-mint); margin-bottom: 15px;"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.1V5l6 2.1V19z"/></svg>
                        <p style="color: var(--text-main); font-weight: 600; margin-bottom: 5px;">Map Engine Active</p>
                        <p style="color: var(--text-secondary); font-size: 12px; max-width: 260px;">Displaying authorized circle members and your live GPS marker.</p>
                    </div>
                `;
            } else if (tab === 'messages') {
                viewEl.innerHTML = `
                    <div class="section-title">Messages & Direct Chats</div>
                    <div class="chat-box">
                        <div class="messages-list" id="msg-list">Loading secure message history...</div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Type a secure message..." />
                            <button onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                `;
                fetchMessages();
            } else if (tab === 'profile') {
                viewEl.innerHTML = `
                    <div class="section-title">Account Profile</div>
                    <div class="profile-card">
                        <div class="avatar-circle">TC</div>
                        <h3 id="prof-email" style="margin-bottom: 5px;">User Profile</h3>
                        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">Track Circle Member</p>
                        <button class="primary-btn" style="background: var(--danger); color: #fff; margin-bottom: 10px;" onclick="logout()">Sign Out of Account</button>
                    </div>
                `;
                supabaseClient.auth.getUser().then(({data}) => {
                    if (data.user) document.getElementById('prof-email').innerText = data.user.email;
                });
            } else if (tab === 'more') {
                viewEl.innerHTML = `
                    <div class="section-title">More Settings & Safety</div>
                    <div class="gps-card" style="text-align: left; display: flex; flex-direction: column; gap: 12px;">
                        <p style="color: var(--text-main); font-weight: 600; cursor: pointer;">🔒 Privacy & Location Sharing Controls</p>
                        <p style="color: var(--text-main); font-weight: 600; cursor: pointer;">📜 Terms of Service & Privacy Policy</p>
                        <p style="color: var(--text-main); font-weight: 600; cursor: pointer;">🤖 Track AI Assistant Settings</p>
                        <p style="color: var(--danger); font-weight: 600; cursor: pointer;">⚠️ Delete Account & Data Export</p>
                    </div>
                `;
            }
        }

        // --- REALTIME MESSAGING LOGIC ---
        async function fetchMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            const listEl = document.getElementById('msg-list');
            if (!listEl) return;

            if (error) {
                listEl.innerHTML = `<p style="color: var(--danger);">Error loading messages: ${error.message}</p>`;
                return;
            }

            listEl.innerHTML = '';
            if (data.length === 0) {
                listEl.innerHTML = `<p style="color: var(--text-secondary); text-align: center; margin-top: 20px;">No messages yet. Start the conversation!</p>`;
                return;
            }

            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-item';
                div.innerHTML = `<span>${msg.sender_email}</span>${msg.content}`;
                listEl.appendChild(div);
            });
            listEl.scrollTop = listEl.scrollHeight;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const { error } = await supabaseClient.from('messages').insert({
                sender_email: user.email,
                content: text
            });

            if (!error) {
                inputEl.value = '';
                fetchMessages();
            }
        }
    </script>
</body>
</html>
