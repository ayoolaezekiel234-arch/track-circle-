<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Circle - Stay Connected. Stay Close.</title>
    <!-- Supabase CDN SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #080B10;
            --bg-card: #10151D;
            --accent-mint: #19E6A0;
            --text-main: #F7FAF9;
            --text-secondary: #89939F;
            --border-color: #1F293D;
            --danger: #FF5C5C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* --- CINEMATIC SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(135deg, #050b14 0%, var(--bg-main) 50%, #11221b 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash-glow {
            position: absolute; width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(25,230,160,0.2) 0%, rgba(8,11,16,0) 70%);
            border-radius: 50%; animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 1; } }
        .splash-content { position: relative; text-align: center; z-index: 2; }
        .splash-logo {
            font-size: 38px; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(90deg, #F7FAF9, var(--accent-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
        }
        .splash-tagline { font-size: 13px; color: var(--text-secondary); letter-spacing: 4px; text-transform: uppercase; }

        /* --- LANDING & AUTH SCREEN --- */
        #auth-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(rgba(8,11,16,0.85), rgba(8,11,16,0.96)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80') no-repeat center center/cover;
            justify-content: center; align-items: center; z-index: 999; padding: 24px;
        }
        .auth-wrapper {
            width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .logo-circle {
            width: 72px; height: 72px; border: 3px solid var(--accent-mint); border-radius: 50%;
            margin-bottom: 16px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(25,230,160,0.35); background: rgba(8,11,16,0.8);
        }
        .logo-circle svg { width: 36px; height: 36px; fill: var(--accent-mint); }
        .brand-title { font-size: 30px; font-weight: 900; letter-spacing: 1px; color: var(--text-main); margin-bottom: 4px; }
        .brand-title span { color: var(--accent-mint); }
        .brand-tagline { font-size: 11px; color: var(--text-secondary); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }

        .auth-box {
            background: var(--bg-card); padding: 26px 20px; border-radius: 22px;
            width: 100%; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .pill-btn {
            width: 100%; padding: 14px; border-radius: 30px; font-size: 15px; font-weight: 700;
            cursor: pointer; text-align: center; border: none; margin-bottom: 12px; transition: opacity 0.2s;
        }
        .btn-mint { background: var(--accent-mint); color: var(--bg-main); box-shadow: 0 4px 20px rgba(25,230,160,0.3); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        
        #auth-form-view { display: none; text-align: left; }
        .form-heading { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; text-align: center; }
        .form-sub { font-size: 12px; color: var(--text-secondary); margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; padding: 14px 16px;
            background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px;
            color: var(--text-main); font-size: 15px;
        }
        input:focus { outline: none; border-color: var(--accent-mint); }

        /* --- MAIN APP DASHBOARD & NAVIGATION --- */
        #app-dashboard {
            display: none; width: 100%; height: 100vh;
            flex-direction: column; background: var(--bg-main); position: relative; overflow: hidden;
        }
        .app-header {
            padding: 16px 20px; background: var(--bg-main); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-avatar { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--accent-mint); object-fit: cover; }
        .header-titles h1 { font-size: 16px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .header-titles h1 span { color: var(--accent-mint); font-size: 10px; font-weight: 600; background: rgba(25,230,160,0.1); padding: 2px 6px; border-radius: 6px; }
        .header-titles p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        
        .app-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; }

        /* --- BOTTOM NAVIGATION BAR --- */
        .nav-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75px;
            background: var(--bg-card); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { background: none; border: none; color: var(--text-secondary); font-size: 10px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--accent-mint); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-map-btn {
            background: var(--accent-mint); width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--bg-main);
            box-shadow: 0 4px 15px rgba(25,230,160,0.4); margin-top: -16px; cursor: pointer; border: none;
        }
        .dot-pulse { width: 8px; height: 8px; background: var(--accent-mint); border-radius: 50%; box-shadow: 0 0 10px var(--accent-mint); display: inline-block; }

        /* Chat Styles */
        .chat-box { width: 100%; flex: 1; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; height: 400px; }
        .messages-list { flex: 1; padding: 15px; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 10px; }
        .message-item { background: #182232; padding: 10px 14px; border-radius: 10px; max-width: 85%; font-size: 13px; border: 1px solid var(--border-color); }
        .message-item span { display: block; font-size: 10px; color: var(--accent-mint); margin-bottom: 4px; font-weight: 700; }
        .chat-input-area { display: flex; padding: 10px; background: var(--bg-main); border-top: 1px solid var(--border-color); gap: 10px; }
        .chat-input-area input { margin: 0; flex: 1; padding: 12px; }
        .chat-input-area button { width: 80px; margin: 0; background: var(--accent-mint); border: none; border-radius: 10px; color: var(--bg-main); font-weight: 800; cursor: pointer; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8,11,16,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 380px; padding: 24px; }
    </style>
</head>
<body>

    <!-- 1. CINEMATIC SPLASH -->
    <div id="splash-screen">
        <div class="splash-glow"></div>
        <div class="splash-content">
            <div class="splash-logo">TRACK CIRCLE</div>
            <div class="splash-tagline">Stay Connected. Stay Close.</div>
        </div>
    </div>

    <!-- 2. ONBOARDING & AUTHENTICATION -->
    <div id="auth-container">
        <div class="auth-wrapper">
            <div class="logo-circle">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <div class="brand-title">TRACK <span>CIRCLE</span></div>
            <div class="brand-tagline">Stay Connected. Stay Close.</div>

            <div class="auth-box">
                <div id="auth-buttons-view">
                    <button class="pill-btn btn-mint" onclick="showEmailForm('signin')">Sign In &rarr;</button>
                    <button class="pill-btn btn-outline" onclick="showEmailForm('signup')">Create Account</button>
                </div>

                <div id="auth-form-view">
                    <div class="form-heading" id="form-heading">Sign In</div>
                    <div class="form-sub" id="form-sub">Enter your credentials below</div>
                    
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" />
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" />
                    </div>
                    
                    <button class="pill-btn btn-mint" id="action-btn" onclick="handleAuthSubmit()" style="margin-top: 10px;">Sign In</button>
                    <button class="pill-btn btn-outline" onclick="resetAuthView()" style="margin-bottom: 0;">Back</button>
                    <div id="message" style="text-align: center; font-size: 12px; margin-top: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. MAIN APPLICATION DASHBOARD -->
    <div id="app-dashboard">
        <div class="app-header">
            <div class="header-left">
                <img class="header-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar">
                <div class="header-titles">
                    <h1>TRACK CIRCLE <span>Beta</span></h1>
                    <p id="time-greeting">Good Morning, Ezekiel ☀️</p>
                </div>
            </div>
        </div>

        <div class="app-content" id="main-view-area">
            <!-- Dynamic view loaded here -->
        </div>

        <!-- 6-DESTINATION BOTTOM NAVIGATION BAR -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('home', this)">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </button>
            <button class="nav-item" onclick="switchTab('circles', this)">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3z"/></svg>
                Circles
            </button>
            <button class="nav-map-btn" onclick="switchTab('map', this)" title="Live Map">
                <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: #080B10;"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.1V5l6 2.1V19z"/></svg>
            </button>
            <button class="nav-item" onclick="switchTab('messages', this)">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                Messages
            </button>
            <button class="nav-item" onclick="switchTab('profile', this)">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/></svg>
                Profile
            </button>
            <button class="nav-item" onclick="switchTab('track', this)">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                Track
            </button>
        </div>
    </div>

    <!-- MODAL POPUP FOR CIRCLE CREATION -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <h3 style="color: var(--accent-mint); margin-bottom: 14px;">Create New Circle</h3>
            <div class="input-group">
                <label>Circle Name</label>
                <input type="text" id="modal-input-name" placeholder="e.g. Family Trip, School Group" />
            </div>
            <button class="pill-btn btn-mint" onclick="submitCircleCreation()" style="margin-top: 10px;">Save Circle</button>
            <button class="pill-btn btn-outline" onclick="closeModal()" style="margin-bottom: 0;">Cancel</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kthhdwaqqhqioxvfhjlx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aGhkd2FxcWhxaW94dmZoamx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjIwMzQsImV4cCI6MjEwNzQ5ODAzNH0.lJyrG_lKfBW0G3o2cgkm_AiBqw19e9Go8c3TW-BPm20';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activeAuthMode = 'signin';

        window.addEventListener('load', async () => {
            setTimeout(async () => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('splash-screen').style.visibility = 'hidden';

                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    enterApp(session.user);
                } else {
                    document.getElementById('auth-container').style.display = 'flex';
                }
            }, 2000);
        });

        function updateGreeting(userEmail) {
            const hour = new Date().getHours();
            let greeting = 'Good Morning ☀️';
            if (hour >= 12 && hour < 17) greeting = 'Good Afternoon 🌤️';
            else if (hour >= 17) greeting = 'Good Evening 🌙';
            const username = userEmail ? userEmail.split('@')[0] : 'Ezekiel';
            const formattedName = username.charAt(0).toUpperCase() + username.slice(1);
            document.getElementById('time-greeting').innerText = `${greeting}, ${formattedName}`;
        }

        function showEmailForm(mode) {
            activeAuthMode = mode;
            document.getElementById('auth-buttons-view').style.display = 'none';
            document.getElementById('auth-form-view').style.display = 'block';
            document.getElementById('form-heading').innerText = mode === 'signin' ? 'Sign In' : 'Create Account';
            document.getElementById('form-sub').innerText = mode === 'signin' ? 'Access your Track Circle account' : 'Set up your secure credentials';
            document.getElementById('action-btn').innerText = mode === 'signin' ? 'Sign In' : 'Sign Up';
        }

        function resetAuthView() {
            document.getElementById('auth-buttons-view').style.display = 'block';
            document.getElementById('auth-form-view').style.display = 'none';
            document.getElementById('message').innerText = '';
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('message');

            if (!email || !password) {
                msgEl.style.color = 'var(--danger)';
                msgEl.innerText = 'Please fill in both email and password.';
                return;
            }

            msgEl.style.color = 'var(--accent-mint)';
            msgEl.innerText = 'Authenticating...';

            if (activeAuthMode === 'signin') {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) { msgEl.style.color = 'var(--danger)'; msgEl.innerText = error.message; }
                else { enterApp(data.user); }
            } else {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) { msgEl.style.color = 'var(--danger)'; msgEl.innerText = error.message; }
                else { 
                    msgEl.style.color = 'var(--accent-mint)'; 
                    msgEl.innerText = 'Account created successfully!';
                    if (data.user) enterApp(data.user);
                }
            }
        }

        function enterApp(user) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-dashboard').style.display = 'flex';
            updateGreeting(user.email);
            switchTab('home');
            syncDeviceGPS();
        }

        function syncDeviceGPS() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (position) => {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                await supabaseClient.from('user_locations').upsert({ 
                    user_id: user.id, 
                    latitude: position.coords.latitude, 
                    longitude: position.coords.longitude, 
                    updated_at: new Date() 
                }, { onConflict: 'user_id' });
            });
        }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // --- REALTIME CHAT FUNCTIONS ---
        async function loadChatMessages() {
            const listEl = document.getElementById('msg-list');
            if (!listEl) return;

            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                listEl.innerHTML = `<p style="color: var(--danger); font-size: 12px;">Error: ${error.message}</p>`;
                return;
            }

            listEl.innerHTML = '';
            if (data.length === 0) {
                listEl.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size: 12px; margin-top: 20px;">No messages yet. Start the conversation!</p>`;
                return;
            }

            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-item';
                div.innerHTML = `<span>${msg.sender_email}</span>${msg.content}`;
                listEl.appendChild(div);
            });
            listEl.scrollTop = listEl.scrollHeight;
        }

        async function sendChatMessage() {
            const inputEl = document.getElementById('chat-input');
            const content = inputEl.value.trim();
            if (!content) return;

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const { error } = await supabaseClient.from('messages').insert({
                sender_email: user.email,
                content: content
            });

            if (!error) {
                inputEl.value = '';
                loadChatMessages();
            } else {
                alert('Failed to send: ' + error.message);
            }
        }

        // --- CIRCLES MANAGEMENT ---
        function openModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        async function submitCircleCreation() {
            const name = document.getElementById('modal-input-name').value.trim();
            if (!name) { alert('Please enter a circle name'); return; }

            const { error } = await supabaseClient.from('groups').insert({ name });
            if (!error) {
                alert('Circle created successfully!');
                closeModal();
                switchTab('circles');
            } else {
                alert('Error creating circle: ' + error.message);
            }
        }

        async function loadUserCircles() {
            const listEl = document.getElementById('circles-list');
            if (!listEl) return;

            const { data, error } = await supabaseClient.from('groups').select('*').order('created_at', { ascending: false });
            if (error) {
                listEl.innerHTML = `<p style="color: var(--danger);">Error loading circles: ${error.message}</p>`;
                return;
            }

            listEl.innerHTML = '';
            if (data.length === 0) {
                listEl.innerHTML = `<p style="color: var(--text-secondary); font-size: 13px;">No circles created yet. Tap "+ New Circle" to start one!</p>`;
                return;
            }

            data.forEach(group => {
                const card = document.createElement('div');
                card.style.background = 'var(--bg-card)';
                card.style.border = '1px solid var(--border-color)';
                card.style.borderRadius = '16px';
                card.style.padding = '16px';
                card.style.marginBottom = '12px';
                card.innerHTML = `
                    <h3 style="color: var(--accent-mint); margin-bottom: 4px; font-size: 16px;">${group.name}</h3>
                    <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 12px;">Active tracking session enabled.</p>
                    <button class="pill-btn btn-outline" style="padding: 8px 14px; font-size: 12px; width: auto; margin:0;" onclick="alert('Join Code for ${group.name}: TRK-9921')">View Join Code</button>
                `;
                listEl.appendChild(card);
            });
        }

        function switchTab(tab, el) {
            if (el) {
                document.querySelectorAll('.nav-item, .nav-map-btn').forEach(item => item.classList.remove('active'));
                el.classList.add('active');
            }
            const viewEl = document.getElementById('main-view-area');

            if (tab === 'home') {
                viewEl.innerHTML = `
                    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px;">
                        <p style="font-size: 11px; color: var(--text-secondary);">Location Status</p>
                        <h3 style="font-size: 14px; margin-top: 6px; color: var(--accent-mint);">Sharing Live GPS</h3>
                        <p style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">Connected to Supabase tracking node.</p>
                        <button class="pill-btn btn-mint" style="margin-top: 14px; padding: 10px; font-size: 13px;" onclick="syncDeviceGPS(); alert('GPS Position Refreshed & Synced!');">Update Location</button>
                    </div>

                    <div style="background: linear-gradient(rgba(8,11,16,0.6), rgba(8,11,16,0.9)), url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80') center/cover; border-radius: 18px; border: 1px solid var(--border-color); padding: 22px;">
                        <p style="font-size: 10px; color: var(--accent-mint); font-weight: 700; text-transform: uppercase; margin-bottom: 6px;">Active Community</p>
                        <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 4px; color: var(--text-main);">The Dreamers Circle</h3>
                        <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 16px;">12 active members • 3.4 km away</p>
                        <button class="pill-btn btn-mint" style="width: auto; padding: 8px 16px; font-size: 12px;" onclick="switchTab('circles')">View Circle &rarr;</button>
                    </div>
                `;
            } else if (tab === 'circles') {
                viewEl.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 style="font-size: 18px; font-weight: 800;">Circle Management</h2>
                        <button class="pill-btn btn-mint" style="width: auto; padding: 8px 16px; font-size: 12px; margin: 0;" onclick="openModal()">+ New Circle</button>
                    </div>
                    <div id="circles-list">Loading your circles...</div>
                `;
                loadUserCircles();
            } else if (tab === 'map') {
                viewEl.innerHTML = `
                    <div style="font-size: 18px; font-weight: 800; margin-bottom: 15px;">Live GPS Radar Map</div>
                    <div style="background: linear-gradient(rgba(13,19,28,0.85), rgba(13,19,28,0.95)), url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=800&q=80') center/cover; border-radius: 18px; border: 1px solid var(--border-color); padding: 30px 20px; text-align: center; height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                        <div class="dot-pulse" style="width: 14px; height: 14px; margin-bottom: 15px;"></div>
                        <h3 style="color: var(--text-main); margin-bottom: 6px; font-size: 18px;">Satellite GPS Lock Active</h3>
                        <p style="color: var(--text-secondary); font-size: 12px; max-width: 280px; margin-bottom: 20px;">Your device coordinates are actively broadcasting to authorized circle members.</p>
                        <button class="pill-btn btn-mint" style="max-width: 200px; padding: 12px;" onclick="syncDeviceGPS(); alert('Coordinates re-synced successfully!');">Refresh Radar Position</button>
                    </div>
                `;
            } else if (tab === 'messages') {
                viewEl.innerHTML = `
                    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 10px;">Private Messages & DMs</h2>
                    <div class="chat-box">
                        <div class="messages-list" id="msg-list">Loading secure message history...</div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Type a message..." />
                            <button onclick="sendChatMessage()">Send</button>
                        </div>
                    </div>
                `;
                loadChatMessages();
            } else if (tab === 'profile') {
                viewEl.innerHTML = `
                    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 15px;">User Profile & Settings</h2>
                    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 24px; text-align: center;">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent-mint); margin: 0 auto 14px; object-fit: cover;">
                        <h3 id="profile-email-display" style="font-size: 15px; margin-bottom: 4px; color: var(--text-main);">Account Settings</h3>
                        <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 20px;">Track Circle Pro Member</p>
                        <button class="pill-btn" style="background: var(--danger); color: #fff; max-width: 220px; margin: 0 auto; padding: 12px;" onclick="logoutUser()">Sign Out</button>
                    </div>
                `;
                supabaseClient.auth.getUser().then(({ data }) => {
                    if (data.user) {
                        document.getElementById('profile-email-display').innerText = data.user.email;
                    }
                });
            } else if (tab === 'track') {
                viewEl.innerHTML = `
                    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 10px;">Track Feed</h2>
                    <p style="color: var(--text-secondary); font-size: 13px;">Short videos and social tracking feed.</p>
                `;
            }
        }
    </script>
</body>
</html>
